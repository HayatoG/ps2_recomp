[package]
name = "ps2launch"
version = "0.1.0"
edition = "2021"
description = "Launcher leve e generico para ports PS2 (valida o dump do usuario, extrai dados e inicia o port)"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
